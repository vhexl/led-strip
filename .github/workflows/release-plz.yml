name: Release-plz

# After a push to main, release-plz opens/updates a Release PR.
# Publishing waits for successful push CI on the same main commit.
# release-plz.toml limits publication to Release PR revisions.

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # Keep the publish event as push for crates.io Trusted Publishing. This job
  # waits for the existing CI run without duplicating CI or gaining write access.
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'vhexl' }}
    permissions:
      actions: read
      checks: read # needed by gh run watch
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Wait for successful push CI
        id: ci
        run: |
          run_id=
          for attempt in {1..30}; do
            run_id=$(gh run list --repo "$GH_REPO" --workflow ci.yml --branch main --event push --commit "$RELEASE_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::No push CI run found for main commit $RELEASE_SHA."
            exit 1
          fi
          gh run watch "$run_id" --repo "$GH_REPO" --interval 10 --exit-status

  # -- Publish to crates.io + create GitHub release ------------------
  release-plz-release:
    name: Release-plz release
    needs: wait-for-ci
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'vhexl' }}
    permissions:
      contents: write # needed to create git tags
      id-token: write # needed for crates.io Trusted Publishing (OIDC)
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Run release-plz release
        # Keep this CI-validated revision even when main has advanced. The config
        # skips ordinary commits instead of publishing them with a prepared version.
        # release-plz may select the merged Release PR's ancestor commit for the
        # package/tag, following its built-in release commit selection.
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
        env:
          # No CARGO_REGISTRY_TOKEN: with id-token: write, release-plz exchanges
          # the job's OIDC token for a short-lived crates.io token. This needs a
          # Trusted Publisher on crates.io (owner vhexl, repository led-strip,
          # workflow release-plz.yml, no environment).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -- Create / update Release PR ------------------------------------
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.repository_owner == 'vhexl' && github.event_name == 'push' }}
    permissions:
      contents: write # needed to push version bump branches
      pull-requests: write # needed to create/update the Release PR
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Run release-plz release-pr
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release-pr
        env:
          # GITHUB_TOKEN-created/updated PRs need a maintainer to approve CI.
          # Set RELEASE_PLZ_TOKEN (a PAT or GitHub App token) for automatic CI.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
