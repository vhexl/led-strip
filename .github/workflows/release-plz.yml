name: Release-plz

# After merging to main, release-plz:
# 1. Opens/updates a Release PR with version bumps and changelog
# 2. On Release PR merge: publishes to crates.io and creates a GitHub release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # -- Publish to crates.io + create GitHub release ------------------
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'vhexl' }}
    permissions:
      contents: write # needed to create git tags
      id-token: write # needed for crates.io Trusted Publishing (OIDC)
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Run release-plz release
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
        env:
          # No CARGO_REGISTRY_TOKEN: with id-token: write, release-plz exchanges
          # the job's OIDC token for a short-lived crates.io token. This needs a
          # Trusted Publisher on crates.io (owner vhexl, repository led-strip,
          # workflow release-plz.yml, no environment).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -- Create / update Release PR ------------------------------------
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'vhexl' }}
    permissions:
      contents: write # needed to push version bump branches
      pull-requests: write # needed to create/update the Release PR
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Run release-plz release-pr
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release-pr
        env:
          # PRs opened with GITHUB_TOKEN do not trigger CI; set RELEASE_PLZ_TOKEN
          # (a PAT or GitHub App token) to run the checks on release PRs.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
